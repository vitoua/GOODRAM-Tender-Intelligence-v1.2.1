{% extends 'base.html' %}{% block c %}<h1>{{t.analytics}}</h1><div class="kpis"><div><b>{{count}}</b><span>Przetargi</span></div><div><b>{{data.countries|length}}</b><span>Kraje</span></div><div><b>{{data.sources|length}}</b><span>Źródła</span></div></div><div class="charts"><article><canvas id="a"></canvas></article><article><canvas id="b"></canvas></article></div>{% endblock %}{% block scripts %}<script>const D={{data|tojson}};new Chart(a,{type:'bar',data:{labels:Object.keys(D.countries),datasets:[{data:Object.values(D.countries)}]}});new Chart(b,{type:'doughnut',data:{labels:Object.keys(D.sources),datasets:[{data:Object.values(D.sources)}]}});</script>{% endblock %}
